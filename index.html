                        q: "<strong>Example 1:</strong> Use the diagram to find the measure of each angle if $m\\angle ABE = 17^\\circ$.<div class='sub-questions'><div>a. $m\\angle EBC$</div><div>b. $m\\angle EBD$</div></div>",

                    {

                    },
                    {
                        q: "If $m\\angle DBE = (3x)^\\circ$ and $m\\angle CBF = (19x - 6)^\\circ$, find $m\\angle ABF$. Explain your answer.",
                        figure: `<div class="figure-box">
                            <svg width="280" height="170" viewBox="0 0 280 170">
                                <line x1="30" y1="100" x2="250" y2="100" stroke="#0c4a6e" stroke-width="2.5"/>
                                <line x1="140" y1="100" x2="140" y2="20" stroke="#0c4a6e" stroke-width="2.5"/>

                                <text x="40" y="120" font-weight="bold" fill="#0c4a6e">A</text>

                                <text x="235" y="120" font-weight="bold" fill="#0c4a6e">C</text>
                                <text x="125" y="30" font-weight="bold" fill="#0c4a6e">D</text>
                                <text x="182" y="42" font-weight="bold" fill="#0284c7">E</text>

                        a: "$$\\frac{1\\text{ cm}}{0.2\\text{ m}} = \\frac{x\\text{ cm}}{1.5\\text{ m}} \\implies x = \\frac{1.5}{0.2} = 7.5\\text{ cm}$$<strong>Correct Answer: D. $7.5\\text{ cm}$</strong>"
                    },
                    {
                        q: "The scale drawing of a spider enlarges the size by a scale factor of $15$. The length of a spider in the scale drawing is $9\\text{ centimeters}$. How long is the actual spider?",
                        options: ["A. $0.6\\text{ cm}$", "B. $1.35\\text{ cm}$", "C. $1.6\\text{ cm}$", "D. $6\\text{ cm}$"],
                        a: "$$\\text{Actual length} = \\frac{9\\text{ cm}}{15} = 0.6\\text{ cm}$$<strong>Correct Answer: A. $0.6\\text{ cm}$</strong>"
                    },
                    {
                        q: "Asmah is making a scale drawing of her classroom. The classroom is $5.5\\text{ meters}$ by $7.1\\text{ meters}$. The scale drawing must fit on a $20\\text{ cm}$ by $28\\text{ cm}$ piece of paper. Can she fit a drawing with a scale of $3.5\\text{ cm} : 1\\text{ m}$? Explain your answer.",
                        a: "• Drawing width: $5.5 \\times 3.5 = 19.25\\text{ cm}$ (which is $< 20\\text{ cm}$).<br>• Drawing length: $7.1 \\times 3.5 = 24.85\\text{ cm}$ (which is $< 28\\text{ cm}$).<br><strong>Yes, she can fit the drawing</strong> because $19.25\\text{ cm} \\times 24.85\\text{ cm}$ fits inside the $20\\text{ cm} \\times 28\\text{ cm}$ piece of paper."
                    },
                    {
                        q: "A scale drawing showing the layout for a new store uses a scale factor of $0.04$. If the actual store measures $4.8\\text{ meters}$ by $6.2\\text{ meters}$, what are the dimensions of the drawing?",
                        a: "• Drawing width: $$4.8\\text{ m} \\times 0.04 = 0.192\\text{ m} = 19.2\\text{ cm}$$• Drawing length: $$6.2\\text{ m} \\times 0.04 = 0.248\\text{ m} = 24.8\\text{ cm}$$"
                    }
                ]
            }
        ];

        const appContainer = document.getElementById('app');
        let globalQuestionCounter = 1;
        const generateWorkspace = () => {
            let lines = '';
            for (let i = 0; i < 8; i++) lines += '<div class="writing-line"></div>';
            return `<div class="student-workspace">${lines}</div>`;
        };
        revisionData.forEach(sectionData => {
            const sectionHeader = document.createElement('h2');
            sectionHeader.className = 'section-title';
            sectionHeader.textContent = sectionData.section;
            appContainer.appendChild(sectionHeader);
            sectionData.questions.forEach(item => {
                const card = document.createElement('div');
                card.className = 'question-card';
                let optionsHTML = item.options && item.options.length > 0
                    ? `<div class="options-grid">` + item.options.map(opt => `<div class="option-item">${opt}</div>`).join('') + `</div>`
                    : '';
                let figureHTML = item.figure ? item.figure : '';
                card.innerHTML = `
                    <div class="q-number">${globalQuestionCounter}</div>
                    <div class="question-text">${item.q}</div>
                    ${figureHTML}
                    ${optionsHTML}
                    ${generateWorkspace()}
                    <button class="btn-toggle" onclick="toggleSolution(this)">Show Solution</button>
                    <div class="solution-box">${item.a}</div>
                `;
                appContainer.appendChild(card);
                globalQuestionCounter++;
            });
        });
        function toggleSolution(btn) {
            const solutionBox = btn.nextElementSibling;
            if (solutionBox.style.display === "block") {
                solutionBox.style.display = "none";
                btn.textContent = "Show Solution";
            } else {
                solutionBox.style.display = "block";
                btn.textContent = "Hide Solution";
            }
        }
        window.addEventListener("load", function() {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ],
                throwOnError: false
            });
        });
    </script>
</body>
</html>
